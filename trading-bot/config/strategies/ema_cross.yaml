# Cruce de medias con filtro de tendencia.
# Línea base del PLAN: hard stop + trailing chandelier, más el objetivo.
# El trailing está prendido POR DISEÑO ("las plantillas arrancan con dos capas
# prendidas"), no porque se haya medido que aporta: no compite en el torneo de la
# tanda 2C, es lo que el resto tiene que superar. El informe lo aclara donde
# aparece. El break-even, la reversión, el giveback, el time stop y el régimen son
# del torneo; config.py los rechaza con un mensaje explícito si se agregan ahora.
#
# La misma plantilla con el trailing apagado está en ema_cross_sin_trailing.yaml:
# es la corrida base del banco A/B (`tradingbot comparar`) y la que usan las
# mediciones de sizing, que son del lado de la entrada y no tienen por qué
# depender de una capa de salida.
name: ema_cross_trend_filter
universe: [AAPL, MSFT, SPY, QQQ]
interval: 1d
warmup_bars: 200              # barras descartadas hasta que los indicadores son válidos

indicators:
  ema_fast:  {type: ema,  source: close, period: 20}
  ema_slow:  {type: ema,  source: close, period: 50}
  sma_trend: {type: sma,  source: close, period: 200}
  rsi:       {type: rsi,  source: close, period: 14}
  atr:       {type: atr,  period: 14}

entry:
  all:                                                    # AND
    - {left: ema_fast, op: crosses_above, right: ema_slow}
    - {left: close,    op: ">",           right: sma_trend}
    - {left: rsi,      op: "<",           right: 70}

exits:
  signal:                      # la salida por reglas es UNA capa más
    any:
      - {left: ema_fast, op: crosses_below, right: ema_slow}
  hard_stop:   {mode: atr, multiple: 2.0, atr_period: 14}
  # 3 x ATR desde el MÁXIMO alcanzado, sin activarse hasta que el trade avanzó 1R.
  # El nivel se recalcula al cierre de cada vela y rige desde la siguiente.
  trailing_stop:
    mode:             chandelier
    multiple:         3.0
    atr_period:       14
    activate_after_r: 1.0
  take_profit: {mode: rr,  ratio: 3.0}

calibration:
  version: 4
  date: 2026-09-15
  changed: >-
    initial_cash 10000 -> 100000. Con $10.000 contra ETFs de $50-600 el sizing
    quedaba degenerado: 44 de 77 rechazos eran "no hay cash para comprar ni 1
    acción" (universo.py, medido sobre los 13 ETFs reales), que contamina
    cualquier medición sobre la línea base. Ver PLAN.md, "Cash real: antes de
    medir nada". Nada del lado de las reglas cambió.

execution:
  signal_on:      close          # la regla se evalúa con la vela CERRADA
  fill_on:        next_open      # la orden se ejecuta en la apertura siguiente
  commission_pct: 0.05
  slippage_pct:   0.05

risk:
  position_sizing:    {mode: risk_pct, risk_pct: 1.0, on: current_equity}
  # Tope de concentración. 30% y no 20% por una razón medida, no por gusto:
  # el tope decide el tamaño (y risk_pct queda decorativo) cuando la distancia al
  # stop es menor que risk_pct/max_position_pct. Con 1.0/20 ese umbral es 5%, y un
  # stop de 2xATR sobre estos papeles está a ~4.4%: el tope ataba 21 de 31 trades y
  # el riesgo real promedio caía a 0.78R. Con 1.0/30 el umbral baja a 3.33% y el
  # riesgo vuelve a ~0.95R. Si cambiás risk_pct, revisá este número: el motor avisa
  # cuando la combinación vuelve a dejar a risk_pct sin decidir nada.
  max_position_pct:   30
  max_open_positions: 5

backtest:
  start:         2010-01-01
  end:           2025-12-31
  initial_cash:  100000
  in_sample_end: 2020-12-31      # todo lo posterior queda reservado como out-of-sample
