# ema_cross.yaml con el trailing APAGADO. No es otra estrategia ni una plantilla
# para operar: es el par de comparación de la de al lado.
#
# Existe por dos motivos concretos:
#
#   1. El banco A/B (`tradingbot comparar -b ema_cross_sin_trailing.yaml
#      -v ema_cross.yaml`) necesita las dos corridas sobre los mismos datos para
#      emparejar trade contra trade. Sin este archivo, "el trailing mejora la
#      expectancy" no se puede ni plantear como medición.
#   2. Las mediciones de riesgo realizado y de quién decide el tamaño
#      (`scripts/riesgo_realizado.py`) son del lado de la ENTRADA. Con una capa de
#      salida prendida, el tamaño de las posiciones pasa a depender de cuándo
#      salieron las anteriores (equity y cash), y el número deja de medir lo que
#      dice medir.
#
# Los dos archivos tienen que ser idénticos salvo el bloque trailing_stop, el
# nombre y la calibración: hay un test que lo verifica
# (test_trailing_chandelier.py).
name: ema_cross_trend_filter_sin_trailing
universe: [AAPL, MSFT, SPY, QQQ]
interval: 1d
warmup_bars: 200              # barras descartadas hasta que los indicadores son válidos

indicators:
  ema_fast:  {type: ema,  source: close, period: 20}
  ema_slow:  {type: ema,  source: close, period: 50}
  sma_trend: {type: sma,  source: close, period: 200}
  rsi:       {type: rsi,  source: close, period: 14}
  atr:       {type: atr,  period: 14}

entry:
  all:                                                    # AND
    - {left: ema_fast, op: crosses_above, right: ema_slow}
    - {left: close,    op: ">",           right: sma_trend}
    - {left: rsi,      op: "<",           right: 70}

exits:
  signal:                      # la salida por reglas es UNA capa más
    any:
      - {left: ema_fast, op: crosses_below, right: ema_slow}
  hard_stop:   {mode: atr, multiple: 2.0, atr_period: 14}
  take_profit: {mode: rr,  ratio: 3.0}

calibration:
  version: 4
  date: 2026-09-15
  changed: >-
    initial_cash 10000 -> 100000, igual que ema_cross.yaml v4 y por el mismo
    motivo: el sizing degenerado por falta de cash (PLAN.md, "Cash real: antes
    de medir nada"). Comparte calibración de entrada con ella (max_position_pct
    30, risk_pct 1.0), que es lo que hace que el banco A/B mida la capa y no dos
    estrategias distintas.

execution:
  signal_on:      close          # la regla se evalúa con la vela CERRADA
  fill_on:        next_open      # la orden se ejecuta en la apertura siguiente
  commission_pct: 0.05
  slippage_pct:   0.05

risk:
  position_sizing:    {mode: risk_pct, risk_pct: 1.0, on: current_equity}
  # Tope de concentración. 30% y no 20% por una razón medida, no por gusto:
  # el tope decide el tamaño (y risk_pct queda decorativo) cuando la distancia al
  # stop es menor que risk_pct/max_position_pct. Con 1.0/20 ese umbral es 5%, y un
  # stop de 2xATR sobre estos papeles está a ~4.4%: el tope ataba 21 de 31 trades y
  # el riesgo real promedio caía a 0.78R. Con 1.0/30 el umbral baja a 3.33% y el
  # riesgo vuelve a ~0.95R. Si cambiás risk_pct, revisá este número: el motor avisa
  # cuando la combinación vuelve a dejar a risk_pct sin decidir nada.
  max_position_pct:   30
  max_open_positions: 5

backtest:
  start:         2010-01-01
  end:           2025-12-31
  initial_cash:  100000
  in_sample_end: 2020-12-31      # todo lo posterior queda reservado como out-of-sample
