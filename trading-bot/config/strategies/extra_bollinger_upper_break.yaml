# PLANTILLA EXTRA — no es la del plan.
#
# Ruptura de la banda superior de Bollinger con filtro de fuerza de tendencia.
# NO reemplaza a `breakout_52w`: el máximo móvil de 52 semanas es ruptura de
# momentum y Bollinger es reversión a la media, o sea otra familia de estrategia.
# `breakout_52w` sigue pendiente y llega con el indicador donchian en la tanda 2;
# hasta entonces ese slot queda vacío a propósito.
name: extra_bollinger_upper_break
universe: [AAPL, MSFT, SPY, QQQ]
interval: 1d
warmup_bars: 200

indicators:
  bb:        {type: bollinger, source: close, period: 20, std: 2.0}
  sma_trend: {type: sma, source: close, period: 200}
  adx:       {type: adx, period: 14}
  atr:       {type: atr, period: 14}

entry:
  all:
    - {left: close, op: crosses_above, right: bb.upper}
    - {left: close, op: ">",           right: sma_trend}
    - {left: adx,   op: ">",           right: 20}        # solo con tendencia con fuerza

exits:
  signal:
    any:
      - {left: close, op: crosses_below, right: bb.middle}
  hard_stop:   {mode: atr, multiple: 2.0, atr_period: 14}
  take_profit: {mode: rr,  ratio: 3.0}

execution:
  signal_on:      close
  fill_on:        next_open
  commission_pct: 0.05
  slippage_pct:   0.05

risk:
  position_sizing:    {mode: risk_pct, risk_pct: 1.0, on: current_equity}
  max_position_pct:   25
  max_open_positions: 4

backtest:
  start:         2010-01-01
  end:           2025-12-31
  initial_cash:  10000
  in_sample_end: 2020-12-31
