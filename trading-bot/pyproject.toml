[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Bot de análisis de trading swing diario sobre acciones y ETFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "yfinance>=1.7",
  "pyarrow>=15",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "typer>=0.12",
  "plotly>=5.22",
  "jinja2>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
# ta: referencia para validar indicadores. backtesting: cotejo del motor.
# playwright: verificación responsive del informe (necesita `playwright install chromium`).
dev = ["pytest>=8", "ta>=0.11", "backtesting>=0.6", "playwright>=1.44"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "itsdangerous>=2.1"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.setuptools.package-data]
"tradingbot.reporting" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: necesita internet (se saltea si no hay conectividad)",
  "playwright: necesita Chromium/Playwright instalado",
]
filterwarnings = ["ignore::DeprecationWarning"]
